name: Publish n8n Package

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write  # Required for version bump commit and release creation
  id-token: write  # Required for npm OIDC trusted publishing

jobs:
  version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Bump version
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="${major}.${minor}.${NEW_PATCH}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          npm version $NEW_VERSION --no-git-tag-version
      
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

  build:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false  # never use caching in release builds

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate || true

      # Uncomment if you add tests later
      # - name: Run tests
      #   run: npm test

      - name: Build package (TypeScript + Gulp)
        run: npm run build

      - name: Show package contents
        run: npm pack --dry-run

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            package.json
            README.md
            LICENSE

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/n8n-nodes-lusha

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Publish package to npm
        run: npm publish --access public
        # No NODE_AUTH_TOKEN needed - npm CLI auto-detects OIDC and uses trusted publishing
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.new_version }}" \
            --title "v${{ needs.version.outputs.new_version }}" \
            --generate-notes \
            --target main

      - name: Generate checksums
        run: |
          FILE="$(npm pack --silent)"
          echo "Packed file: $FILE"
          sha256sum "$FILE" > "${FILE}.sha256"
      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: |
            *.tgz
            *.tgz.sha256
