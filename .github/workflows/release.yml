name: Publish n8n Package

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'docs/**'

permissions:
  contents: write  # create GitHub Release + tag
  id-token: write  # npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/@lusha-org/n8n-nodes-lusha

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Determine next version
        id: version
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v$(node -p "require('./package.json').version")"
          fi
          IFS='.' read -r major minor patch <<< "${LATEST#v}"
          NEW_VERSION="${major}.${minor}.$((patch + 1))"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: npm version "${{ steps.version.outputs.new_version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate || true

      - name: Build package (TypeScript + Gulp)
        run: npm run build

      - name: Publish package to npm
        run: npm publish --access public
        # No NODE_AUTH_TOKEN needed - npm CLI auto-detects OIDC and uses trusted publishing

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.new_version }}" \
            --title "v${{ steps.version.outputs.new_version }}" \
            --generate-notes \
            --target "${{ github.sha }}"
