name: Publish n8n Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for npm OIDC trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false  # never use caching in release builds

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate || true

      # Uncomment if you add tests later
      # - name: Run tests
      #   run: npm test

      - name: Build package (TypeScript + Gulp)
        run: npm run build

      - name: Show package contents
        run: npm pack --dry-run

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            package.json
            README.md
            LICENSE

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'lusha-oss/n8n-nodes-lusha'
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/@n8n/n8n-nodes-lusha

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Publish package to npm
        run: npm publish --access public
        # No NODE_AUTH_TOKEN needed - npm CLI auto-detects OIDC and uses trusted publishing

      - name: Generate checksums
        run: |
          FILE="$(npm pack --silent)"
          echo "Packed file: $FILE"
          sha256sum "$FILE" > "${FILE}.sha256"
      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: |
            *.tgz
            *.tgz.sha256
